<text x="25" y="65" class="d"><tspan x="25" dy="0">Tidy a messy Downloads folder by type or date in a</tspan><tspan x="25" dy="18">simple Windows app: preview, undo and duplicate</tspan><tspan x="25" dy="18">finder. Free .exe in release V1.</tspan></text>
